name: 나라장터 입찰공고 모니터링

on:
  schedule:
    # 매일 오전 9시 KST (= 0시 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  check-bids:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore bid history DB
        uses: actions/cache/restore@v4
        with:
          path: bid_history.db
          key: bid-history-db
          restore-keys: bid-history-db

      - name: Run monitor
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_KEYWORD_GROUPS: "영상+제작|홍보영상"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --hours 24

      - name: Save bid history DB
        if: always()
        run: |
          gh cache delete bid-history-db --repo ${{ github.repository }} || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload bid history DB
        uses: actions/cache/save@v4
        if: always()
        with:
          path: bid_history.db
          key: bid-history-db

      # 60일 무활동 시 GitHub가 스케줄 워크플로우를 자동 비활성화하는 것을 방지
      - name: Keepalive commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git add .last-run
          git commit -m "chore: keepalive (마지막 실행 기록)" || true
          git pull --rebase origin master || true
          git push || true
